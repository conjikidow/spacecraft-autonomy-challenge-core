[tool.bumpversion]
current_version = "2.0.1"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "uv.lock"
search = 'name = "spacecraft-autonomy-challenge-core"\nversion = "{current_version}"'
replace = 'name = "spacecraft-autonomy-challenge-core"\nversion = "{new_version}"'
regex = true
