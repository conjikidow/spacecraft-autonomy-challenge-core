[project]
name = "spacecraft-autonomy-challenge-core"
version = "1.3.0"
description = "Participant API, reference simulator, and evaluation tools for the Spacecraft Autonomy Challenge"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "packaging>=24.0",
]

[project.scripts]
autonomy-challenge = "spacecraft_autonomy_challenge.cli:main"

[project.optional-dependencies]
marimo = [
  "marimo>=0.25.2",
]

[dependency-groups]
dev = [
  "marimo>=0.25.2",
  "pytest>=9.1.1",
  { include-group = "lint" },
]
lint = [
  "ruff==0.17.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
required-version = "==0.17.1"
line-length = 120

[tool.ruff.lint]
select = [
  "ANN",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PIE",
  "PT",
  "RET",
  "RUF",
  "SIM",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.uv]
exclude-newer = "3 days"

[tool.uv.build-backend]
module-name = "spacecraft_autonomy_challenge"
