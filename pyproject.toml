[project]
name = "spacecraft-operations-challenge-core"
version = "0.1.2"
description = "Participant API, reference simulator, and evaluation tools for the Spacecraft Operations Challenge"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
spacecraft-ops-challenge = "spacecraft_ops_challenge.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  { include-group = "lint" },
]
lint = [
  "ruff==0.17.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
required-version = "==0.17.1"
line-length = 120

[tool.ruff.lint]
select = [
  "ANN",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PIE",
  "PT",
  "RET",
  "RUF",
  "SIM",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.uv]
exclude-newer = "3 days"

[tool.uv.build-backend]
module-name = "spacecraft_ops_challenge"
