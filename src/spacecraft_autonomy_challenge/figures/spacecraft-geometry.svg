<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 475 240" width="475" height="240" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222">
  <title>Spacecraft viewed along the wheel axis: two offset thrusters and a single-axis reaction wheel</title>
  <defs>
    <marker id="head-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a4f57"/>
    </marker>
    <marker id="head-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f6fb2"/>
    </marker>
    <marker id="head-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c75f14"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="475" height="240" fill="#fff"/>

  <!-- Thrust direction -->
  <line x1="230" y1="22" x2="300" y2="22" stroke="#4a4f57" stroke-width="2" marker-end="url(#head-dark)"/>
  <text x="222" y="27" text-anchor="end">Thrust (Δv) direction</text>

  <!-- Body -->
  <rect x="110" y="45" width="200" height="180" rx="6" fill="#eef1f5" stroke="#4a4f57" stroke-width="2"/>

  <!-- Reaction wheel, axis out of page -->
  <circle cx="280" cy="135" r="20" fill="#fff" stroke="#4a4f57" stroke-width="3"/>
  <circle cx="280" cy="135" r="3.5" fill="#4a4f57"/>
  <line x1="302" y1="135" x2="330" y2="135" stroke="#4a4f57" stroke-width="1"/>
  <text x="334" y="120">Reaction wheel</text>
  <text x="334" y="136">axis out of page</text>
  <text x="334" y="152">+H counterclockwise</text>

  <!-- Reference line through the center of mass -->
  <line x1="110" y1="135" x2="258" y2="135" stroke="#4a4f57" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Lines of action -->
  <line x1="110" y1="205" x2="300" y2="205" stroke="#1f6fb2" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="110" y1="87" x2="300" y2="87" stroke="#c75f14" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Center of mass -->
  <circle cx="200" cy="135" r="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <path d="M200 135 L200 127 A8 8 0 0 1 208 135 z M200 135 L200 143 A8 8 0 0 1 192 135 z" fill="#222"/>
  <text x="155" y="152" text-anchor="end" font-size="11">CoM</text>

  <!-- Torques about the center of mass -->
  <path d="M163.3 144.8 A38 38 0 0 0 236.7 144.8" fill="none" stroke="#1f6fb2" stroke-width="2" marker-end="url(#head-1)"/>
  <text x="239" y="172" fill="#1f6fb2">τ<tspan dy="4" font-size="10">1</tspan></text>
  <path d="M173.1 108.1 A38 38 0 0 1 226.9 108.1" fill="none" stroke="#c75f14" stroke-width="2" marker-end="url(#head-2)"/>
  <text x="233" y="106" fill="#c75f14">τ<tspan dy="4" font-size="10">2</tspan></text>

  <!-- Thrusters -->
  <polygon points="110,199 110,211 94,215 94,195" fill="#4a4f57"/>
  <polygon points="110,81 110,93 94,97 94,77" fill="#4a4f57"/>

  <!-- Thrust forces -->
  <line x1="14" y1="205" x2="88" y2="205" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#head-1)"/>
  <text x="48" y="196" fill="#1f6fb2">F<tspan dy="4" font-size="10">1</tspan></text>
  <line x1="32" y1="87" x2="88" y2="87" stroke="#c75f14" stroke-width="2.5" marker-end="url(#head-2)"/>
  <text x="56" y="105" fill="#c75f14">F<tspan dy="4" font-size="10">2</tspan></text>

  <text x="52" y="230" text-anchor="middle">Thruster 1</text>
  <text x="56" y="70" text-anchor="middle">Thruster 2</text>
</svg>
