name: Bump version

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      bump-type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions: {}

jobs:
  bump-version:
    name: Bump version
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Bump version
        uses: conjikidow/bump-version-action@f63d3275c47f3bf6348d6f58e47e9aee5addd55b # v4.2.3
        with:
          label-major: update::major
          label-minor: update::minor
          label-patch: update::patch
          manual-bump-type: ${{ inputs.bump-type }}
          labels-to-add: automated,release
          create-release: true
